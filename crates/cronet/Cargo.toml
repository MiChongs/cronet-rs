[package]
name = "cronet"
description = "Safe Rust ownership layer for Chromium Cronet"
categories = ["network-programming", "api-bindings"]
keywords = ["cronet", "chromium", "http3", "quic", "networking"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**", "examples/**", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22"
cronet-sys = { path = "../cronet-sys", version = "0.2.0" }
futures-channel = "0.3"
fastrand = "2"
hickory-proto = "0.26.1"
serde_json = "1"
url = "2.5"

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
rcgen = "0.13"
rustls = "0.23"
time = { version = "=0.3.36", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
tokio-rustls = "0.26"

[lints]
workspace = true
